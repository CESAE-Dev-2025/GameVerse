<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="card text-center shadow">
    <h2 class="mb-4">Login</h2>
    <form>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Digite o seu email" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Palavra-passe</label>
        <input type="password" class="form-control" id="password" placeholder="Digite a sua palavra-passe" required>
      </div>
      <button type="submit" class="btn btn-custom w-100 mt-3">Entrar</button>
      <p class="mt-3">Não tem conta?
        <a href="./registo.html" class="text-warning text-decoration-none">Registe-se</a>
      </p>
    </form>
    <a href="../" class="btn btn-outline-light w-100 mt-3">Voltar ao Índice</a>
  </div>

  <!-- ==================== EMAILJS ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    emailjs.init({ publicKey: 'ThuNHCZmdbg_bfRDC' });
  </script>

  <!-- ==================== LOGIN SCRIPT ==================== -->
  <script>
    (function () {
      const form = document.querySelector('form');
      if (!form) return;

      const passEl = document.getElementById('password');
      let status = document.getElementById('login-status');
      if (!status) {
        status = document.createElement('p');
        status.id = 'login-status';
        status.style.marginTop = '8px';
        status.style.fontSize = '.9rem';
        passEl.insertAdjacentElement('afterend', status);
      }
      const setMsg = (msg, color) => { status.textContent = msg; status.style.color = color || ''; };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const emailEl = document.getElementById('email');
        const userEmail = (emailEl?.value || '').trim();
        if (!userEmail) {
          setMsg('Indique um email válido.', '#ff8080');
          return;
        }

        setMsg('A enviar...', '#cfd3df');

        const SERVICE_ID = 'service_9ffn7kk';
        const TEMPLATE_ID = 'template_ls8tggb';

        const params = {
          email: userEmail,
          to_email: userEmail,
          reply_to: userEmail,

          name: userEmail.split('@')[0],
          reason: 'Login verification required',
          attempt_time: new Date().toLocaleString(),
          ip_address: 'unknown',
          device: navigator.platform,
          browser: navigator.userAgent,
          location: 'unknown',
          reset_link: 'https://gameverse.com/reset',
          verify_link: 'https://gameverse.com/verify',
          support_email: 'support@gameverse.com',

          message: `Hi ${userEmail.split('@')[0]}, We blocked a login / register to your Gameverse account. It’s not possible to sign in or register until you take action. Reason: Login verification required Attempt details: - Time: ${new Date().toLocaleString()} - IP: unknown - Device: ${navigator.platform} / ${navigator.userAgent} - Location: unknown Do this next: 1) Reset password: https://gameverse.com/reset 2) Verify email (if needed): https://gameverse.com/verify 3) Need help? support@gameverse.com Until one of these steps is completed, login will remain blocked. — The Gameverse Security Team www.gameverse.com`
        };

        try {
          await emailjs.send(SERVICE_ID, TEMPLATE_ID, params);
          setMsg('Email enviado com sucesso! Verifique a sua caixa de entrada.', '#7CFC90');
          passEl.value = '';
        } catch (err) {
          console.error('Falha EmailJS:', err);
          const msg = /recipient is empty/i.test(String(err))
            ? 'Não foi possível enviar: o destinatário está vazio no template. Confirme que o campo "To Email" usa {{email}} ou {{to_email}}.'
            : 'Não foi possível enviar o e-mail agora. Tente novamente.';
          setMsg(msg, '#ff8080');
        }
      });
    })();
  </script>

</body>

</html>
