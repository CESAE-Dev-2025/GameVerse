<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  
</head>
<body>
  <div class="card text-center shadow">
    <h2 class="mb-4">Login</h2>
    <form>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Digite o seu email" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Palavra-passe</label>
        <input type="password" class="form-control" id="password" placeholder="Digite a sua palavra-passe" required>
      </div>
      <button type="submit" class="btn btn-custom w-100 mt-3">Entrar</button>
      <p class="mt-3">Não tem conta? <a href="/GameVerse/user/registo.html" class="text-warning text-decoration-none">Registe-se</a></p>
    </form>
    <a href="/GameVerse/" class="btn btn-outline-light w-100 mt-3 ">Voltar ao Índice</a>
  </div>
</body>
</html>
